name: Deploy to GitHub Pages

# האתר נבנה ומפורסם לענף gh-pages:
#   main   → https://<owner>.github.io/<repo>/
#   כל PR  → https://<owner>.github.io/<repo>/pr/<מספר>/   (תצוגה מקדימה)
# הגדרה חד-פעמית: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    # תצוגה מקדימה רק ל-PR מתוך ה-repo עצמו (לא מ-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || '.' }}
          keep_files: true
          commit_message: 'deploy: ${{ github.event_name == ''pull_request'' && format(''PR #{0}'', github.event.pull_request.number) || ''main'' }} @ ${{ github.sha }}'
      - name: קישור לתצוגה המקדימה ב-PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const n = context.payload.pull_request.number;
            const base = `https://${owner.toLowerCase()}.github.io/${repo}/pr/${n}/`;
            await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: `תצוגה מקדימה (מתעדכנת בכל push, דקה-שתיים אחרי שה-workflow מסתיים):\n- גרסה A: ${base}?v=a\n- גרסה B: ${base}?v=b\n- גרסה C: ${base}?v=c\n- אדמין: ${base}admin.html` });
