<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>סאבתון GTA 6</title>
    <meta name="description" content="המסע של הסאבתון: סטוריז של כל מיילסטון, קליפים, המפה והמספרים." />
    <meta name="theme-color" content="#fff7ef" />
    <link rel="manifest" href="./phone.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="סאבתון" />
    <meta property="og:title" content="סאבתון GTA 6" />
    <meta property="og:description" content="סטוריז של כל מיילסטון, קליפים, המפה והמספרים." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/phone-app/app.css" />
  </head>
  <body>
    <aside class="desk" aria-hidden="true">
      <p class="desk__kicker">סאבתון GTA 6</p>
      <p class="desk__title">המסע, בכיס.</p>
      <p class="desk__sub">נבנה קודם כול לטלפון. פתחו את הכתובת בנייד, או המשיכו כאן.</p>
    </aside>
    <div class="app" id="app">
      <header class="bar">
        <a class="bar__brand" href="#home" aria-label="סאבתון GTA 6, לדף הבית"><span class="bar__logo" aria-hidden="true">6</span><span>סאבתון</span></a>
        <span class="bar__end">
          <button class="bar__install" type="button" data-install hidden>להתקין</button>
          <button class="bar__live" type="button" data-live hidden>בלייב</button>
        </span>
      </header>
      <main class="views">
        <section class="view view--home" id="view-home" data-view="home" aria-label="בית"></section>
        <section class="view view--map" id="view-map" data-view="map" aria-label="מפה" hidden></section>
        <section class="view view--clips" id="view-clips" data-view="clips" aria-label="קליפים" hidden></section>
        <section class="view view--stats" id="view-stats" data-view="stats" aria-label="סטטיסטיקות" hidden></section>
      </main>
      <nav class="tabs" aria-label="ניווט ראשי">
        <a class="tab" href="#home" data-tab="home"><span class="tab__ico" data-ico="House"></span><span>בית</span></a>
        <a class="tab" href="#map" data-tab="map"><span class="tab__ico" data-ico="Map"></span><span>מפה</span></a>
        <a class="tab" href="#clips" data-tab="clips"><span class="tab__ico" data-ico="Clapperboard"></span><span>קליפים</span></a>
        <a class="tab" href="#stats" data-tab="stats"><span class="tab__ico" data-ico="ChartColumnBig"></span><span>מספרים</span></a>
      </nav>
    </div>
    <div class="story" data-story hidden></div>
    <div class="sheet-wrap" data-sheet hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/phone-app/app.ts"></script>
  </body>
</html>
